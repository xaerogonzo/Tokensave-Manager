# Attach the VS Code extension to a GitHub release.
#
# Distribution is deliberately **VSIX + release automation, not the
# Marketplace**: no publisher account, no `VSCE_PAT`, no marketplace
# obligations. What this buys is that a fresh machine can install the extension
# without a checkout and without anyone hand-running `vsce package`.
#
# Triggered by a release being published, and by hand (`workflow_dispatch`) so
# a failed upload can be retried without re-tagging. Both paths are idempotent:
# `gh release upload --clobber` replaces an asset that is already there instead
# of failing halfway through.
#
# Two things are verified before anything is uploaded, because a release
# artefact is the one build nobody re-checks:
#
#   1. the version in the artefact matches `constants.APP_VERSION`, which is
#      this project's single canonical version (it cannot come from
#      `git describe` — the Nuitka onefile build ships without a repository);
#   2. the package contains what it should and, more importantly, does NOT
#      contain a bundled CLI binary. `.vscodeignore` used to exclude only
#      `bin/**/README.md`, so a locally built tokensave-manager-cli.exe would
#      have been packaged — a ~14 KB extension becoming ~15 MB, carrying a
#      snapshot CLI that goes stale the moment the Manager changes.

name: Release extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the .vsix to (e.g. v2.2.1)"
        required: true
        type: string

permissions:
  contents: write            # needed to upload a release asset

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install (locked)
        run: npm ci

      # The gate runs here too. An artefact built from code whose own tests
      # were never run is exactly the thing a release should not contain.
      - name: Typecheck and test
        run: |
          npm run compile
          npm test

      - name: Package
        run: npx --yes @vscode/vsce package --target win32-x64

      - name: Verify the package before uploading
        working-directory: .
        run: python .github/scripts/verify_vsix.py

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" ./*.vsix --clobber
