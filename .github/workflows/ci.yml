# TokenSave Manager — CI pipeline.
#
# Five layers of safety:
#
#   0. `extension`       — the VS Code extension's TypeScript: typecheck +
#                          its own test suite (always runs).
#   1. `check`           — syntax + pyflakes + import hygiene (always runs).
#   2. `test-warn`       — full pytest suite on push to long-lived
#                          integration branches (Roadmap-*); warn-only.
#   3. `test-gate`       — full pytest suite on PRs to main/master;
#                          HARD gate — failing tests block the merge, and
#                          coverage must stay above the floor.
#   4. `test-postmerge`  — full pytest suite on push to main/master
#                          (i.e. the merge itself); HARD gate so bad
#                          merge resolutions surface immediately.
#
# Why three test jobs instead of one with conditional `continue-on-error`:
# self-documenting in the Actions UI. Each job's `if:` predicate makes the
# gating story obvious without reading expression syntax.
#
# The three shared their steps verbatim and had to be edited in lockstep, so
# the steps now live in `_test_suite.yml` and each job passes only what makes
# it different. Note `continue-on-error` cannot be set on a job that calls a
# reusable workflow, which is why warn-only is an input rather than a job key.
#
# Branch policy:
#   * Push to short-lived feature branches: NO test workflow runs. Run
#     tests locally before opening a PR.
#   * Push to Roadmap-* integration branches: `test-warn` only.
#   * Open / update PRs to main or master: `test-gate` only.
#   * Push to main / master directly (post-merge): `test-postmerge` only.
#
# This split also prevents the test job from firing twice on the same
# SHA when a PR's branch is pushed (only ONE predicate matches per event).

name: CI

on:
  push:
    branches: [main, master, 'Roadmap-*']
  pull_request:
    branches: [main, master]

jobs:
  # ── Syntax + pyflakes + import hygiene (always runs) ────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall src/ -q
      - name: pyflakes
        run: |
          pip install pyflakes --quiet
          python -m pyflakes src/
      - name: No third-party module-level imports in src/
        # Runs here (an import-free job) so it fires even when a bad top-level
        # optional import would abort the main test suite's collection.
        run: python tests/test_no_thirdparty_module_imports.py
      - name: No Windows-only subprocess flags in src/
        # Same reasoning: these raise AttributeError on the Linux runner, and
        # catching that here reports the actual cause rather than a confusing
        # failure buried in whichever test happened to touch the code path.
        run: python tests/test_no_windows_only_subprocess_flags.py
      - name: No shadowed tests in tests/
        # A test name defined twice means the earlier one is never collected:
        # it cannot pass and cannot fail, and the suite count drops silently.
        # pyflakes reports it, but this job only lints src/ -- and linting the
        # whole test tree would mean gating on 78 unused-import findings first.
        run: python tests/test_no_shadowed_tests.py
      - name: No cross-thread Tk calls in src/
        # A worker calling self.after() does not raise on Linux, it
        # BLOCKS with no log line. Ratcheted: known offenders may not
        # grow and no new file may join them.
        run: python tests/test_no_cross_thread_tk.py

  # ── Pytest suite on Roadmap-* branches (warn-only) ─────────────────────
  test-warn:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/Roadmap-')
    uses: ./.github/workflows/_test_suite.yml
    with:
      continue_on_error: true

  # ── Pytest suite on PRs to main/master (HARD gate, with coverage) ──────
  test-gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_test_suite.yml
    with:
      coverage: true
      coverage_fail_under: 14

  # ── Pytest suite on push to main/master (HARD gate, post-merge) ────────
  test-postmerge:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: ./.github/workflows/_test_suite.yml

  # ── VS Code extension: typecheck + its own suite (always runs) ──────────
  # The extension drives src/cli.py, and its decision logic — which runner to
  # resolve, what an exit code means, whether the envelope schema is one it
  # understands — is exactly the part that can silently drift from the Python
  # side. `test/cli.test.js` stubs the `vscode` module through `Module._load`,
  # so this needs no extension host and no editor download: node --test only.
  #
  # `npm ci` (not `npm install`) so the committed lockfile is authoritative —
  # that is why .gitignore negates its package-lock.json. Node is pinned
  # rather than floating; the range is declared in package.json `engines`.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install (locked)
        run: npm ci
      - name: Typecheck
        run: npm run compile
      - name: Extension tests
        run: npm test

  # The live suite boots a real VS Code with the extension loaded and asks it
  # questions the stub suite cannot: whether a contributed command is actually
  # registered, what a tree row renders as, what reaches the Problems panel.
  #
  # Separate from `extension` rather than appended to it, for two reasons. It
  # needs Python and an X server that the fast job does not, and it starts
  # non-blocking (see `continue-on-error`) — folding it in would make the fast
  # job's verdict depend on a suite that is not yet trusted to gate merges.
  extension-live:
    runs-on: ubuntu-latest
    # NON-BLOCKING FOR NOW. Promote by deleting this line once the job has
    # been green on 10 consecutive pull-request runs — a named number,
    # because "after a few PRs" is how a non-blocking job becomes permanently
    # advisory. Nothing else needs to change when it is promoted.
    continue-on-error: true
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      # The fixture's states come from a real `src/cli.py` run, so the Manager
      # has to be runnable here. It imports no third-party package at module
      # scope (enforced by tests/test_no_thirdparty_module_imports.py), so the
      # standard library plus tkinter is enough.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Editor prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      # The fixture's findings come from `python -m pyflakes`, so without it
      # `checks` returns ok:false with an EMPTY findings list -- which is
      # byte-identical to a fixture that has no defects. Every diagnostics
      # assertion would be vacuously green. The suite's own pre-flight refuses
      # to launch in that state (see assertFixtureProducesFindings), which is
      # how this was caught rather than shipped.
      - name: Analyser the fixture depends on
        run: pip install pyflakes --quiet
      # Keyed on the resolved VS Code build rather than on a path: a partially
      # downloaded or architecture-mismatched Electron must never be reused,
      # and `.vscode-test/` itself stays disposable.
      - name: Cache the editor download
        uses: actions/cache@v4
        with:
          path: vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-stable
      - name: Install (locked)
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Live suite
        run: xvfb-run -a npm run test:live
      # A mutation suite that only ever runs locally rots exactly like the
      # coverage it exists to police.
      - name: Mutation runner
        run: xvfb-run -a npm run test:mutations

  # The live suite loads `out/` through --extensionDevelopmentPath; users
  # install a .vsix. If those ever diverge, the most valuable test is
  # exercising an artifact nobody ships — so this packages the real thing and
  # runs a smoke subset against it.
  extension-vsix:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Editor prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      # The fixture's findings come from `python -m pyflakes`, so without it
      # `checks` returns ok:false with an EMPTY findings list -- which is
      # byte-identical to a fixture that has no defects. Every diagnostics
      # assertion would be vacuously green. The suite's own pre-flight refuses
      # to launch in that state (see assertFixtureProducesFindings), which is
      # how this was caught rather than shipped.
      - name: Analyser the fixture depends on
        run: pip install pyflakes --quiet
      - name: Install (locked)
        run: npm ci
      # No separate packaging step: the runner packages, installs into a
      # throwaway profile, and boots that copy, so a step here would build a
      # second .vsix that nothing tests.
      # copy — see test/integration/runTestsVsix.js. It does NOT pass
      # --disable-extensions: correct for the development-path suite, that
      # flag switches off an extension that is genuinely installed, and VS
      # Code has no --enable-extension to pair with it. Isolation comes from
      # the fresh --extensions-dir holding exactly one extension.
      - name: Smoke the packaged extension
        run: xvfb-run -a npm run test:vsix
